name: Keep Streamlit app awake

on:
  schedule:
    - cron: '0 */6 * * *'    # every 4 hours (UTC)
  workflow_dispatch:          # lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sSL -o /dev/null -w "HTTP %{http_code}\n" \
            "https://fundraising-analytics218281y321fs1.streamlit.app/"
